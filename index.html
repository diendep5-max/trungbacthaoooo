<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Trứng Bắc Thảo</title>
    <!-- Font chữ Mali đáng yêu -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Mali', cursive;
            /* Nền màu kem pastel nhẹ nhàng, tinh tế, không bị "gớm" nữa */
            background-color: #fff9f0;
            background-image: radial-gradient(#ffe3e3 2px, transparent 2px);
            background-size: 30px 30px; /* Họa tiết chấm bi mờ đáng yêu */
            color: #5c4d4d;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Ảnh bìa zoom to */
        .cover-image {
            width: 450px;
            max-width: 90%;
            border-radius: 30px;
            border: 6px solid #fff;
            box-shadow: 0 12px 25px rgba(255, 179, 198, 0.4);
            margin: 20px auto;
            display: block;
            pointer-events: none; /* Không bị vướng khi kéo sticker */
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: #ff758f;
            text-shadow: 2px 2px 0px #fff;
            font-weight: 700;
        }

        /* Khung chứa các nút */
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        button {
            color: #fff;
            border: 3px solid #fff;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            transition: all 0.2s;
            font-weight: 700;
        }

        .btn-1 { background-color: #ffb3c6; }
        .btn-2 { background-color: #a0c4ff; }
        .btn-3 { background-color: #ffd6a5; color: #6b5b5b; }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(2px);
        }

        #next-btn {
            background-color: #ff9fb6; 
            color: #fff;
            display: none; 
            margin: 20px auto;
            font-size: 1.4rem;
            padding: 12px 45px;
        }

        #result-area {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
            z-index: 10;
            position: relative;
            min-height: 400px;
        }

        #result-text {
            font-size: 2rem;
            color: #ff4d6d;
            margin-bottom: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #result-img {
            width: 350px;
            max-width: 90%;
            border-radius: 30px;
            border: 6px solid #fff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            animation: bounceIn 0.8s;
            display: none; 
            pointer-events: none;
        }

        /* --- STICKER BAY LƯỢN VÀ KÉO THẢ --- */
        .draggable-sticker {
            position: absolute;
            width: 120px;
            cursor: grab;
            z-index: 5;
            user-select: none;
            touch-action: none; /* Rất quan trọng để lướt điện thoại không bị trôi trang */
            /* Hiệu ứng bay lơ lửng mặc định */
            animation: float 4s infinite alternate ease-in-out;
        }

        .draggable-sticker:active {
            cursor: grabbing;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Hiệu ứng thả tim */
        .heart {
            position: fixed;
            font-size: 2.5rem;
            color: #ff4d6d;
            animation: flyUp 3s ease-in forwards;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- NHÂN BẢN STICKER ĐỂ CHÚNG BAY LUNG TUNG -->
    <!-- Bạn có thể kéo thả bất kỳ bé nào trong này -->
    <img src="download (4)_2.jpg" class="draggable-sticker" style="top: 5%; left: 5%;" alt="Sticker">
    <img src="download (4)_2.jpg" class="draggable-sticker" style="top: 40%; right: 5%; animation-delay: 1s;" alt="Sticker">
    <img src="download (4)_2.jpg" class="draggable-sticker" style="bottom: 10%; left: 15%; animation-delay: 2s;" alt="Sticker">
    
    <img src="download (6)_2.jpg" class="draggable-sticker" style="top: 15%; right: 10%; animation-delay: 0.5s;" alt="Sticker">
    <img src="download (6)_2.jpg" class="draggable-sticker" style="top: 60%; left: 8%; animation-delay: 1.5s;" alt="Sticker">
    <img src="download (6)_2.jpg" class="draggable-sticker" style="bottom: 15%; right: 15%; animation-delay: 2.5s;" alt="Sticker">

    <!-- Ảnh bìa -->
    <img src="download (2)_2.jpg" class="cover-image" alt="Ảnh bìa trứng bắc thảo cute">

    <h1>Xin chào, chào mừng tới với thế giới trứng bắc thảo!</h1>

    <div class="button-container">
        <button class="btn-1" onclick="showResult('tui-la-ai')">tui là ai?</button>
        <button class="btn-2" onclick="showResult('ban-la-gi')">bạn là gì của tui?</button>
        <button class="btn-3" onclick="showResult('tai-sao')">tại sao lại có cái web này?</button>
    </div>

    <div id="result-area">
        <h2 id="result-text"></h2>
        <button id="next-btn" class="btn-1" onclick="showNext()">Next ➔</button>
        <img id="result-img" src="" alt="Kết quả">
    </div>

    <script>
        // === LOGIC TẠO TIM BAY TỨ TUNG ===
        function createHearts() {
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '💖';
                    heart.classList.add('heart');
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = window.innerHeight + 'px';
                    heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                    document.body.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, 3000);
                }, i * 80); 
            }
        }

        // === LOGIC HIỂN THỊ NÚT BẤM VÀ ẢNH MỚI ===
        function showResult(type) {
            const resultArea = document.getElementById('result-area');
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');

            resultArea.style.display = 'flex';
            resultImg.style.animation = 'none';
            resultImg.offsetHeight; 
            resultImg.style.animation = 'bounceIn 0.8s';
            
            if (type === 'tui-la-ai') {
                resultText.innerText = 'ngừi bạn đáng iu nhất thế giới';
                resultImg.src = '591871576072367109_2.jpg'; // Ảnh mới _2
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'ban-la-gi') {
                resultText.innerText = 'ngừi bạn iu iu cụa tui, cảm ơn bạn zì đã tới với thế zới này';
                resultImg.src = '891290582524068607_2.jpg'; // Ảnh mới _2
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'tai-sao') {
                resultText.innerText = 'vì tui mún cảm ơn bạn và....';
                resultImg.style.display = 'none'; 
                nextBtn.style.display = 'block';
            }
        }

        function showNext() {
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');
            
            resultText.innerText = 'hong nói hihi';
            resultImg.src = 'download (1)_3.jpg'; // Ảnh suỵt mới _3
            resultImg.style.display = 'block';
            nextBtn.style.display = 'none'; 
            
            resultImg.style.animation = 'none';
            resultImg.offsetHeight;
            resultImg.style.animation = 'bounceIn 0.8s';
            createHearts();
        }

        // === LOGIC KÉO THẢ STICKER BẰNG CHUỘT / CẢM ỨNG ĐIỆN THOẠI ===
        const draggables = document.querySelectorAll('.draggable-sticker');
        
        draggables.forEach(sticker => {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            const dragStart = (e) => {
                isDragging = true;
                // Khi chạm vào, tạm dừng hiệu ứng bay để dễ kéo
                sticker.style.animation = 'none';
                sticker.style.zIndex = 100; // Đưa sticker lên lớp trên cùng

                if (e.type === 'touchstart') {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }
                
                initialX = sticker.offsetLeft;
                initialY = sticker.offsetTop;
            };

            const dragMove = (e) => {
                if (!isDragging) return;
                // Ngăn chặn cuộn màn hình khi đang kéo trên điện thoại
                if (e.type === 'touchmove') e.preventDefault();
                
                let currentX, currentY;
                if (e.type === 'touchmove') {
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                } else {
                    currentX = e.clientX;
                    currentY = e.clientY;
                }
                
                const dx = currentX - startX;
                const dy = currentY - startY;
                
                sticker.style.left = (initialX + dx) + 'px';
                sticker.style.top = (initialY + dy) + 'px';
            };

            const dragEnd = () => {
                isDragging = false;
                sticker.style.zIndex = 5;
                // Kéo xong cho bé nó tiếp tục bay lơ lửng tại vị trí mới
                sticker.style.animation = 'float 4s infinite alternate ease-in-out';
            };

            // Sự kiện cho chuột (Máy tính)
            sticker.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);

            // Sự kiện cho cảm ứng (Điện thoại/Tablet)
            sticker.addEventListener('touchstart', dragStart, {passive: false});
            document.addEventListener('touchmove', dragMove, {passive: false});
            document.addEventListener('touchend', dragEnd);
        });
    </script>

</body>
</html>
