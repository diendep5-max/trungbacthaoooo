<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Trứng Bắc Thảo</title>
    <!-- Font chữ đáng yêu -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Mali', cursive;
            /* Tone màu Xanh Nhạt - Trắng */
            background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 50%, #bae6fd 100%);
            color: #000; /* Chữ đen */
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Ảnh bìa */
        .cover-image {
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            border: 5px solid #000; /* Viền đen phong cách truyện tranh */
            box-shadow: 8px 8px 0px #000; /* Đổ bóng đen đặc trưng */
            margin: 20px auto;
            display: block;
            background-color: #fff;
        }

        h1 {
            font-size: 2.2rem;
            margin: 30px 0;
            color: #000; /* Đổi thành màu đen */
            font-weight: 700;
            text-shadow: 2px 2px 0px #fff;
        }

        /* Khung chứa các nút */
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        /* Style nút bấm viền đen siêu chất */
        button {
            background-color: #fff; /* Nền trắng */
            color: #000; /* Chữ đen */
            border: 4px solid #000; /* Viền đen */
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #000; /* Đổ bóng đen */
            transition: all 0.1s ease-in-out;
            font-weight: 700;
        }

        button:hover {
            background-color: #93c5fd; /* Chuột vào đổi màu xanh */
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #000;
        }

        button:active {
            transform: translate(5px, 5px); /* Hiệu ứng lún nút */
            box-shadow: 0px 0px 0px #000;
        }

        /* Nút Next màu đen */
        #next-btn {
            background-color: #000; 
            color: #fff;
            display: none; 
            margin: 20px auto;
        }
        #next-btn:hover {
            background-color: #1e293b;
        }

        /* Khu vực hiện kết quả */
        #result-area {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            position: relative;
            min-height: 400px;
        }

        #result-text {
            font-size: 1.8rem;
            color: #000;
            margin-bottom: 20px;
            font-weight: 700;
            background: #fff;
            border: 4px solid #000;
            padding: 10px 25px;
            border-radius: 15px;
            box-shadow: 5px 5px 0px #000;
        }

        #result-img {
            width: 350px;
            max-width: 90%;
            border-radius: 20px;
            border: 5px solid #000;
            box-shadow: 8px 8px 0px #000;
            background-color: #fff;
            display: none; 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hoạt ảnh nhảy ra của ảnh */
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* STICKER BAY LƠ LỬNG (Đã sửa lỗi) */
        .floating-sticker {
            position: absolute;
            width: 110px;
            z-index: 1; /* Cho chìm ra sau */
            animation: float 4s ease-in-out infinite alternate;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.3)); /* Đổ bóng nhẹ cho sticker */
        }

        .st-1 { top: 5%; left: 5%; animation-duration: 4s; }
        .st-2 { top: 35%; right: 5%; animation-duration: 5s; width: 90px; }
        .st-3 { bottom: 10%; left: 10%; animation-duration: 4.5s; }
        .st-4 { top: 15%; right: 15%; animation-duration: 5.5s; }
        .st-5 { bottom: 30%; right: 8%; animation-duration: 6s; width: 100px; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-10deg); }
            100% { transform: translateY(-30px) rotate(10deg); }
        }

        /* Hiệu ứng thả tim (có viền đen luôn cho chất) */
        .heart {
            position: fixed;
            font-size: 2.5rem;
            color: #ef4444; /* Màu đỏ */
            text-shadow: 2px 2px 0px #000; /* Viền đen */
            animation: flyUp 2.5s linear forwards;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- STICKER BAY LUNG TUNG -->
    <img src="download (4)_2.jpg" class="floating-sticker st-1" alt="Sticker">
    <img src="download (6)_2.jpg" class="floating-sticker st-2" alt="Sticker">
    <img src="download (4)_2.jpg" class="floating-sticker st-3" alt="Sticker">
    <img src="download (6)_2.jpg" class="floating-sticker st-4" alt="Sticker">
    <img src="download (4)_2.jpg" class="floating-sticker st-5" alt="Sticker">

    <!-- Ảnh bìa -->
    <img src="download (2)_2.jpg" class="cover-image" alt="Ảnh bìa trứng bắc thảo cute">

    <h1>Xin chào, chào mừng tới với thế giới trứng bắc thảo!</h1>

    <div class="button-container">
        <button onclick="showResult('tui-la-ai')">tui là ai?</button>
        <button onclick="showResult('ban-la-gi')">bạn là gì của tui?</button>
        <button onclick="showResult('tai-sao')">tại sao lại có cái web này?</button>
    </div>

    <div id="result-area">
        <h2 id="result-text"></h2>
        <button id="next-btn" onclick="showNext()">Next ➔</button>
        <img id="result-img" src="" alt="Kết quả">
    </div>

    <script>
        function createHearts() {
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '💖';
                    heart.classList.add('heart');
                    heart.style.left = Math.random() * 95 + 'vw';
                    heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                    document.body.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, 3000);
                }, i * 100); 
            }
        }

        function showResult(type) {
            const resultArea = document.getElementById('result-area');
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');

            resultArea.style.display = 'flex';
            
            // Xóa animation để chạy lại
            resultImg.style.animation = 'none';
            resultImg.offsetHeight; 
            resultImg.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            
            if (type === 'tui-la-ai') {
                resultText.innerText = 'ngừi bạn đáng iu nhất thế giới';
                resultImg.src = '591871576072367109_2.jpg'; 
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'ban-la-gi') {
                resultText.innerText = 'ngừi bạn iu iu cụa tui, cảm ơn bạn zì đã tới với thế zới này';
                resultImg.src = '891290582524068607_2.jpg'; 
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'tai-sao') {
                resultText.innerText = 'vì tui mún cảm ơn bạn và....';
                resultImg.style.display = 'none'; 
                nextBtn.style.display = 'block';
            }
        }

        function showNext() {
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');
            
            resultText.innerText = 'hong nói hihi';
            resultImg.src = 'download (1)_3.jpg'; 
            resultImg.style.display = 'block';
            nextBtn.style.display = 'none'; 
            
            resultImg.style.animation = 'none';
            resultImg.offsetHeight;
            resultImg.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            createHearts();
        }
    </script>

</body>
</html>
